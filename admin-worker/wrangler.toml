name = "phantom-mail-admin"
main = "worker.js"
compatibility_date = "2024-09-23"

# Workers observability (logs/metrics in the Cloudflare dashboard)
[observability]
enabled = true

# ── Required secrets (set via `wrangler secret put <NAME>`) ──────────────────
#   ADMIN_PASSWORD     — admin login password (worker fails closed without it)
#   RESEND_API_KEY     — Resend API key for security alerts + monthly reports
#   PUSHER_SECRET      — Pusher app secret for announcement broadcasts
# ── Optional secret ──────────────────────────────────────────────────────────
#   ADMIN_TOTP_SECRET  — base32 TOTP bootstrap secret (KV-stored secret set via
#                        /admin/totp/setup takes priority over this)

[vars]
MODE = "hosted"
RESEND_QUOTA_LIMIT = "3000"
ADMIN_REPORT_EMAIL = "admin@mail.unknowns.app"
ADMIN_ALLOWED_ORIGIN = "https://mail.unknowns.app"

# Pusher identifiers (must match email-handler/wrangler.toml).
# APP_ID/KEY are identifiers, not secrets; PUSHER_SECRET is the actual secret.
PUSHER_APP_ID = "2179546"
PUSHER_KEY = "c52890db708136e8b408"
PUSHER_CLUSTER = "ap2"

[[kv_namespaces]]
binding = "EMAILS"
id = "e939b6b99b65475f921642edf71d0187"

[[kv_namespaces]]
binding = "INBOX_META"
id = "73a3e881eda34256bd01216bd9d79bcc"

[[kv_namespaces]]
binding = "API_KEYS"
id = "5aa53de9a1ee4e3d942807f9330997c8"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "phantom-attachments"

[triggers]
crons = ["0 8 1 * *"] # Automated monthly report on 1st of every month at 08:00 UTC
