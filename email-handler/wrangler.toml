name = "phantom-mail-backend"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
MODE = "hosted"
DOMAIN_PRIMARY = "unkn0wn.qzz.io"
DOMAIN_SECONDARY = "phant0m.qzz.io"
MAX_ATTACHMENT_SIZE_MB = "10"
FREE_INBOX_CAP = "10"
PREMIUM_INBOX_CAP = "30"
FREE_MAIL_TTL_SEC = "3600"
GLOBAL_MAIL_TTL_SEC = "1296000" # 15 days

# Public Pusher Credentials
PUSHER_APP_ID = "2179546"
PUSHER_KEY = "c52890db708136e8b408"
PUSHER_CLUSTER = "ap2"

[[kv_namespaces]]
binding = "EMAILS"
id = "e939b6b99b65475f921642edf71d0187"

[[kv_namespaces]]
binding = "INBOX_META"
id = "73a3e881eda34256bd01216bd9d79bcc"

[[kv_namespaces]]
binding = "API_KEYS"
id = "5aa53de9a1ee4e3d942807f9330997c8"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "phantom-attachments"

[triggers]
crons = ["0 */6 * * *"] # 6-hour cron sweep
