name = "phantom-mail-backend"
main = "worker.js"
compatibility_date = "2024-09-23"

# Workers observability (logs/metrics in the Cloudflare dashboard)
[observability]
enabled = true

[vars]
MODE = "hosted"
DOMAIN_PRIMARY = "unkn0wn.qzz.io"
DOMAIN_SECONDARY = "phant0m.qzz.io"
MAX_ATTACHMENT_SIZE_MB = "10"
FREE_INBOX_CAP = "10"
PREMIUM_INBOX_CAP = "30"
FREE_MAIL_TTL_SEC = "3600"
GLOBAL_MAIL_TTL_SEC = "1296000" # 15 days

# Pusher — APP_ID and KEY are identifiers (not secrets); PUSHER_SECRET is the
# actual secret and is set via `wrangler secret put PUSHER_SECRET`.
PUSHER_APP_ID = "2179546"
PUSHER_KEY = "c52890db708136e8b408"
PUSHER_CLUSTER = "ap2"

# ── Secrets (set with: wrangler secret put <NAME>) ──────────────────────────
# PUSHER_SECRET  — required for real-time Pusher triggers.
# RESEND_API_KEY — REQUIRED for email forwarding (outbound sends via Resend).
#                  If unset, forward:{address} rules are silently skipped.
# Optional var: RESEND_QUOTA_LIMIT (default "3000") — global daily cap shared
# by API sends (analytics:emails_sent) + forwards (analytics:emails_forwarded).
#
# Web Push (VAPID) — background push on new mail. Generate once with:
#   npx web-push generate-vapid-keys
# Then set on BOTH this worker AND the Pages project:
#   VAPID_PUBLIC_KEY  — base64url application server key (identifier, not secret;
#                       may also go under [vars]). Set here so the worker can send.
#   VAPID_PRIVATE_KEY — secret (wrangler secret put VAPID_PRIVATE_KEY).
#   VAPID_SUBJECT     — "mailto:you@domain" contact URI.
# If any are unset, sendWebPushToUser() no-ops and mail is unaffected.

[[kv_namespaces]]
binding = "EMAILS"
id = "e939b6b99b65475f921642edf71d0187"

[[kv_namespaces]]
binding = "INBOX_META"
id = "73a3e881eda34256bd01216bd9d79bcc"

[[kv_namespaces]]
binding = "API_KEYS"
id = "5aa53de9a1ee4e3d942807f9330997c8"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "phantom-attachments"

[triggers]
crons = ["0 */6 * * *"] # 6-hour cron sweep
