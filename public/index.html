<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Mail — Disposable Email</title>
    
    <!-- Link preview OG Image -->
    <meta property="og:image" content="https://assets.unknowns.app/og-image.png">
    <meta property="og:title" content="Phantom Mail — Temporary & Disposable Email">
    <meta property="og:description" content="Privacy-first temporary email service with real-time push, dual domains, and cryptographic address claims.">
    
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://js.pusher.com/8.4.0/pusher.min.js"></script>
</head>
<body>
    <!-- Announcement Banner -->
    <div id="announcement-banner">
        <span id="announcement-text">Welcome to Phantom Mail v2.0! Real-time WebSocket delivery enabled.</span>
        <button class="dismiss-btn" onclick="document.getElementById('announcement-banner').style.display='none'">✕</button>
    </div>

    <!-- Main App Container -->
    <div id="app">
        <!-- Left Panel: Address Control & Premium Dashboard -->
        <aside id="left-panel">
            <div class="logo-bar">
                <img src="https://assets.unknowns.app/logo.png" class="site-logo" alt="Phantom Mail">
                <h1 class="site-title">Phantom MAIL</h1>
            </div>

            <!-- Address Card -->
            <div class="address-card">
                <div class="domain-picker">
                    <button class="domain-btn active" id="btn-unkn0wn" onclick="setDomain('unkn0wn.qzz.io')">@unkn0wn.qzz.io</button>
                    <button class="domain-btn" id="btn-phant0m" onclick="setDomain('phant0m.qzz.io')">@phant0m.qzz.io</button>
                </div>

                <div class="address-display" id="address-display">Generating address...</div>

                <div class="action-row">
                    <button class="btn btn-primary" onclick="copyAddress()">📋 Copy</button>
                    <button class="btn" onclick="generateNewAddress()">⚡ Refresh</button>
                </div>

                <button class="btn" id="claim-btn" onclick="claimAddress()" style="display:none; background: var(--violet); color:#fff;">
                    🔒 Claim Address (Ed25519)
                </button>
            </div>

            <!-- Premium Dashboard (Always Visible) -->
            <div class="premium-dashboard">
                <div class="dashboard-header">
                    <span>Account Overview</span>
                    <img src="https://assets.unknowns.app/logo-premium.png" class="premium-badge" id="plan-badge" alt="Plan">
                </div>

                <div class="saved-list" id="saved-list">
                    <div style="font-size:12px; color:var(--text-muted);">Saved Slots (1 Free / 15 Premium)</div>
                    <div id="saved-items-container">
                        <div class="saved-item"><span>No saved addresses</span></div>
                    </div>
                </div>

                <div style="font-size:12px; color:var(--text-muted); margin-top:8px;">
                    Daily API Send Quota: <span id="send-quota-display">0 / 3 sends used</span>
                </div>
            </div>
        </aside>

        <!-- Right Panel: Inbox & Email Reader -->
        <main id="right-panel">
            <header id="main-header">
                <div style="font-size: 14px; color: var(--text-dim);" id="connection-status">
                    🟢 Real-time Connected (Pusher)
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="openCompose()">✉ New Message</button>
                    <button class="btn" onclick="openAccountModal()">⚙ Settings</button>
                </div>
            </header>

            <!-- Inbox Tabs -->
            <div id="inbox-tabs">
                <button class="tab-btn active" id="tab-inbox" onclick="switchTab('inbox')">Inbox (<span id="inbox-count">0</span>)</button>
                <button class="tab-btn" id="tab-sent" onclick="switchTab('sent')">Sent</button>
                <button class="tab-btn" id="tab-starred" onclick="switchTab('starred')">Starred</button>
            </div>

            <!-- Email List -->
            <div id="email-list">
                <div style="padding: 40px; text-align: center; color: var(--text-muted);">
                    Waiting for incoming messages...
                </div>
            </div>
        </main>
    </div>

    <!-- Email Reader Panel -->
    <div id="email-reader">
        <div class="reader-header">
            <button class="btn" onclick="closeReader()">← Back</button>
            <div style="display:flex; gap:8px;">
                <button class="btn" onclick="openRawView()">📄 View Raw</button>
                <button class="btn" onclick="deleteCurrentEmail()" style="color:var(--danger);">🗑 Delete</button>
            </div>
        </div>
        <div class="reader-body" id="reader-body">
            <!-- Rendered email content -->
        </div>
    </div>

    <!-- Batch Actions Bar -->
    <div id="batch-actions-bar">
        <span><strong id="selected-count">0</strong> selected</span>
        <button class="btn" onclick="batchMarkRead()">Mark Read</button>
        <button class="btn" onclick="batchStar()">Star</button>
        <button class="btn" onclick="batchDelete()" style="color:var(--danger);">Delete Selected</button>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav id="mobile-bottom-nav">
        <button class="btn" onclick="switchTab('inbox')">📥 Inbox</button>
        <button class="btn" onclick="openCompose()">✉ Compose</button>
        <button class="btn" onclick="openAccountModal()">⚙ Account</button>
    </nav>

    <script src="/app.js"></script>
</body>
</html>
